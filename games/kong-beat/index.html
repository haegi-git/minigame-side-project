<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>콩비트 - 심심타임</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫘</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../../css/lupin.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <a class="back" href="../../index.html">← 게임 선택</a>
      <button id="mute" class="icon-btn" type="button" aria-label="소리 끄기">🔊</button>

      <section id="select">
        <p class="kicker">심심타임</p>
        <h1>콩비트</h1>
        <p class="lead">네 레인에 떨어지는 노트. 직접 만든 세 곡을 오디오 시계에 맞춰 칩니다.</p>
        <div id="diff-row" class="diff-row" role="radiogroup" aria-label="난이도"></div>
        <div id="song-row" class="song-row"></div>
        <label class="offset">
          <span>소리 지연 보정</span>
          <input id="offset" type="range" min="-80" max="80" step="1" value="0" />
          <b id="offset-val">0 ms</b>
        </label>
        <p class="offset-help">소리가 늦게 들리면 값을 올리세요. 판정과 노트가 함께 이동합니다.</p>
        <ul class="help">
          <li class="kb-only"><kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd> 레인. 홀드는 누르고 있고, 플릭도 같은 키로 칩니다.</li>
          <li class="touch-only">레인을 탭하세요. 홀드는 손을 떼지 말고, 화살표 노트는 위로 튕기세요.</li>
        </ul>
      </section>

      <div id="hud" class="hidden">
        <div class="hud-top">
          <p id="now-playing"></p>
          <button id="btn-quit" type="button">나가기</button>
        </div>
        <div class="hud-stats">
          <p>SCORE <b id="score">0</b></p>
          <p>ACC <b id="acc">100.0%</b></p>
        </div>
        <div id="combo-wrap" class="combo-wrap"><b id="combo">0</b><small>COMBO</small></div>
        <div id="judge-pop" class="judge-pop"></div>
        <div id="mile" class="mile"></div>
      </div>

      <div id="touch-lanes" class="touch-lanes" hidden></div>

      <section id="result" class="hidden">
        <div id="party" class="party" aria-hidden="true"></div>
        <div class="sheet">
          <p class="kicker" id="res-kicker">CLEAR</p>
          <div id="res-rank" class="rank">A</div>
          <h2 id="res-title">곡</h2>
          <p id="res-sub" class="lead"></p>
          <p class="score-xl"><span>SCORE</span> <b id="res-score">0</b></p>
          <ul id="res-stats" class="stats"></ul>
          <div class="actions">
            <button id="btn-retry" type="button">다시</button>
            <button id="btn-back" type="button" class="ghost">곡 선택</button>
          </div>
        </div>
      </section>
    </div>
    <script src="./game.js"></script>
    <script src="../../js/lupin.js" defer></script>
  </body>
</html>
