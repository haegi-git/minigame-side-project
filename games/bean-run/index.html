<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>빈런 - 심심타임</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫘</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="game-root">
      <canvas id="view"></canvas>

      <a class="back" href="../../index.html">← 게임 선택</a>
      <button id="mute" class="mute" type="button" aria-label="소리 끄기">🔊</button>

      <section id="hud" class="hud hidden">
        <div class="hud-card">
          <p class="rank"><span id="rank">1</span><small>/8</small></p>
          <p class="time" id="time">0:00.0</p>
        </div>
        <div class="progress-wrap">
          <div id="progress" class="progress"></div>
        </div>
        <div class="slide-cd">
          <span>슬라이딩</span>
          <div class="slide-bar"><div id="slide-fill"></div></div>
          <small id="slide-hint">준비됨</small>
        </div>
        <p class="keys" id="hud-keys">방향키 / WASD 이동 · 스페이스 점프 · Shift 슬라이딩</p>
      </section>

      <section id="start" class="overlay">
        <div class="panel">
          <p class="kicker">심심타임</p>
          <h1>빈런</h1>
          <p class="lead">말랑콩 8명이 장애물을 넘어 골인까지 달려요. 약 1분, AI와 함께하는 미니 폴가이즈!</p>
          <ul class="controls">
            <li class="kb-only"><kbd>W A S D</kbd> 또는 <kbd>↑ ← ↓ →</kbd> 이동 · 달리기</li>
            <li class="kb-only"><kbd>Space</kbd> 점프</li>
            <li class="kb-only"><kbd>Shift</kbd> 슬라이딩 · <span id="slide-cd-label">1.75초</span> 쿨타임</li>
            <li class="touch-only">왼쪽 스틱으로 이동 · 오른쪽 점프 / 슬라이드</li>
          </ul>
          <p class="diff-label">난이도 · 슬라이딩 쿨타임</p>
          <div class="diff-row" role="radiogroup" aria-label="난이도">
            <button type="button" class="diff-btn" data-diff="easy" aria-pressed="false">
              이지
              <small>1초</small>
            </button>
            <button type="button" class="diff-btn selected" data-diff="normal" aria-pressed="true">
              노말
              <small>1.75초</small>
            </button>
            <button type="button" class="diff-btn" data-diff="hard" aria-pressed="false">
              하드
              <small>2.5초</small>
            </button>
          </div>
          <button id="btn-start" type="button">레이스 시작</button>
        </div>
      </section>

      <div id="countdown" class="overlay hidden">
        <p id="count-num">3</p>
      </div>

      <section id="result" class="overlay hidden">
        <div class="panel">
          <h2 id="result-title">골인!</h2>
          <p id="result-sub" class="lead"></p>
          <ol id="board" class="board"></ol>
          <div class="actions">
            <button id="btn-retry" type="button">한 판 더</button>
            <a class="ghost" href="../../index.html">로비로</a>
          </div>
        </div>
      </section>

      <div id="touch-ui" class="touch-ui hidden" aria-hidden="true">
        <div class="stick" id="stick">
          <div class="stick-knob"></div>
        </div>
        <div class="touch-actions">
          <button type="button" id="btn-jump" class="touch-btn">점프</button>
          <button type="button" id="btn-slide" class="touch-btn slide">슬라이드</button>
        </div>
      </div>
    </div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
